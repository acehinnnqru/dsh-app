<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The shell page ships inside the binary; it must never be reused from a
         webview cache after an update. -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- The window has a system title bar and system traffic lights, and the page
         starts below them. Nothing in here is draggable: AppKit owns the title
         bar, so the page needs no drag region and no window controls of its own.
         @see docs/spec-shell-ux.md §2.2 -->
    <header class="page-head" data-tauri-drag-region="deep">
      <span class="brand">
        <span class="mark" aria-hidden="true">›</span>
        <span class="brand-name">DeepSeek Harness</span>
      </span>
      <span class="spacer"></span>
      <button id="reload" class="icon" type="button" aria-label="Reload the profile list" title="Reload the profile list" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8M13.4 2.4V5.2H10.6" /></svg>
      </button>
      <button id="settings" class="icon" type="button" aria-label="Settings" title="Settings" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.1" /><path d="M8 1.7v1.5M8 12.8v1.5M1.7 8h1.5M12.8 8h1.5M3.6 3.6l1 1M11.4 11.4l1 1M12.4 3.6l-1 1M4.6 11.4l-1 1" /></svg>
      </button>
    </header>

    <!-- Host problems, when there are any. The launcher keeps no other
         diagnostics of its own: they live in the settings sheet. -->
    <div id="banner" class="banner" role="status" hidden></div>

    <main id="view" class="view" role="main"></main>

    <!-- The settings sheet is built when it opens, never from a status event. -->
    <div id="sheet" class="sheet" hidden></div>

    <!-- Rendered by shell.js when the page module fails to evaluate: with no
         runtime behind the page, this strip is the only place a failure shows. -->
    <div id="fatal" class="fatal" hidden></div>

    <script type="module" src="shell.js"></script>
  </body>
</html>
