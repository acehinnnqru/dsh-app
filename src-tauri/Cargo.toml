[package]
name = "dsh-app"
version = "0.0.0"
description = "A Tauri desktop shell for DeepSeek Harness (dsh)"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[lib]
name = "dsh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
