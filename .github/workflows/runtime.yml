# OPTIONAL, MANUAL: publish a runtime for one channel from a GitHub runner.
#
# This is NOT the release path. The primary path is local — `nix build` plus
# `scripts/package-runtime.mjs` on an Apple Silicon machine — because none of
# this workflow has ever been executed and because the runner constraints below
# make hosted runners a poor fit for a 478-package closure.
#
# What it records, so nobody has to rediscover it:
#   * Only Apple Silicon macOS is supported, so there is a single platform here.
#     Standard macOS runners are arm64; Intel (`macos-15-large`) needs a paid
#     larger-runner plan, and the free `macos-13` image is retired.
#   * `macos-15` is a current arm64 image. `macos-14` is deprecated, so pinning
#     it would build on borrowed time.
#   * Hosted macOS runners have ~14 GB of disk. The closure is 210 MB but its
#     build needs the npm store, 482 Rust crates, and a Nix store on top.
#     Expect to need the cleanup step below, or a self-hosted runner.
#   * The Nix multi-user daemon installed by `nix-installer-action` is the most
#     fragile part of this setup.
#
# The artifact format is owned by `src-tauri/src/channel.rs` and produced by
# `scripts/package-runtime.mjs`. This file must not invent either.
name: runtime (optional, manual)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        type: choice
        options: [release, master]
        default: release
      version:
        description: dsh version (release channel; empty means the pinned one)
        type: string
        default: ""
      runner:
        description: Runner label (empty means the hosted macos-15 arm64 image)
        type: string
        default: ""
permissions:
  contents: write

jobs:
  build:
    # `runner` lets a self-hosted machine be used instead of a hosted one, which
    # is the recommended option for this workload.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The image is ~14 GB and the build wants the npm store, the vendor
        # directory for 482 crates, and a Nix store at once.
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /Users/runner/Library/Android /Users/runner/Library/Developer/CoreSimulator 2>/dev/null || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Resolve the version and platform to build
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'release' }}
        run: |
          set -euo pipefail
          # The flake declares a single system, so the platform is a constant
          # here rather than a matrix dimension.
          echo "platform=darwin-arm64" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "master" ]; then
            # A master runtime is built from the harness source, so its version
            # identifies the commit rather than a published release.
            echo "version=master-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          elif [ -n "$REQUESTED" ]; then
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').dshRuntime.version")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the closure
        run: |
          set -euo pipefail
          nix build --no-link --print-out-paths ".#dsh-runtime" > /tmp/closure-path
          cat /tmp/closure-path

      - name: Package the archive and channel document
        env:
          CHANNEL: ${{ inputs.channel || 'release' }}
        run: |
          set -euo pipefail
          closure="$(cat /tmp/closure-path)"
          # The channel document must name the URL the shell will fetch, so the
          # release URL is passed in rather than guessed.
          base="https://github.com/${{ github.repository }}/releases/download/runtime-${{ steps.resolve.outputs.version }}/"
          node scripts/package-runtime.mjs \
            --runtime "$closure" \
            --out dist \
            --channel "$CHANNEL" \
            --base-url "$base"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ steps.resolve.outputs.platform }}-${{ steps.resolve.outputs.version }}
          path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: channel-${{ steps.resolve.outputs.platform }}-${{ steps.resolve.outputs.version }}
          path: dist/*.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One channel document listing every platform of this release: the shell
      # picks the entry for its own platform, so a document per platform would
      # make each install unable to see the others.
      - name: Merge the per-platform entries
        run: |
          set -euo pipefail
          node - <<'JS'
          const { readFileSync, writeFileSync, readdirSync } = require('node:fs')
          const { join } = require('node:path')
          const documents = []
          for (const dir of readdirSync('artifacts')) {
            for (const name of readdirSync(join('artifacts', dir))) {
              if (!name.endsWith('.json')) continue
              documents.push(JSON.parse(readFileSync(join('artifacts', dir, name), 'utf8')))
            }
          }
          if (documents.length === 0) throw new Error('no channel documents were produced')
          const releases = documents.flatMap((document) => document.releases)
          const channel = documents[0].channel
          writeFileSync('channel.json', JSON.stringify({ channel, releases }, null, 2) + '\n')
          console.log(`merged ${releases.length} release(s) into channel.json`)
          JS

      - name: Publish the release
        env:
          CHANNEL: ${{ inputs.channel || 'release' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./channel.json').releases[0].version")"
          tag="runtime-${version}"
          gh release create "$tag" --title "runtime ${version}" --notes "Runtime artifacts for dsh ${version}." || true
          find artifacts -name '*.tar.gz' -exec gh release upload "$tag" {} --clobber \;
          gh release upload "$tag" channel.json --clobber
          echo "published $tag"
